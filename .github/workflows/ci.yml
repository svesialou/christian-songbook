name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t christian-songbook:ci .

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t christian-songbook-api:ci .
